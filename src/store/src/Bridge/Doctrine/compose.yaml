services:
    postgres:
        image: pgvector/pgvector:0.8.0-pg17
        environment:
            POSTGRES_DB: test_database
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - '5432:5432'

    mariadb:
        image: mariadb:11.8
        environment:
            MARIADB_DATABASE: test_database
            MARIADB_ROOT_PASSWORD: root
        ports:
            - '3306:3306'
