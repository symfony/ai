# Classification of the platform bridges listed on /bridges/platforms.
#
# The list of bridges and their Packagist downloads are refreshed every morning by
# "bin/console app:platform-bridges:update". This file adds what GitHub cannot tell,
# keyed by the directory of the bridge in src/platform/src/Bridge. A bridge missing
# here is still listed, as "Not classified yet".
#
# Keys (see the enums in src/PlatformBridge/Taxonomy for the allowed values):
#   name, summary   display name and one-line pitch (default: directory name, no summary)
#   kind            model-provider, inference-platform, cloud-platform, gateway, local-runtime, coding-agent, building-block
#   deployment      where models run: cloud, local
#   hosting         who operates the service: saas, self-hosted
#   regions         where requests can be processed: worldwide, us, europe, asia, and anywhere for self-hosted software
#   model_access    multi-vendor or single-vendor
#   capabilities    chat, tool-calling, structured-output, reasoning, web-search, vision, embeddings,
#                   speech-to-text, text-to-speech, image-generation, video-generation
#   note            one short sentence, only when it tells something the rest does not
#   icon            brands:<name> for the logo of the provider, see assets/icons/brands, or any UX icon
#   website, symfony_docs
#
# Capabilities summarize the model catalogs and model clients of each bridge: only list
# what the bridge supports, not everything the provider offers. Regions must come from
# the documentation of the provider: leave them out rather than guess.

bridges:
    AiMlApi:
        name: AI/ML API
        summary: One API key for hundreds of models from OpenAI, Anthropic, Google, Meta, Mistral and more.
        kind: gateway
        deployment: [cloud]
