services:
    chromadb:
        image: chromadb/chroma:0.5.23
        environment:
            IS_PERSISTENT: TRUE
            PERSIST_DIRECTORY: /chroma/chroma # this is the default path, change it as needed
            ANONYMIZED_TELEMETRY: false
        volumes:
            - chroma_vlm:/chroma/chroma
        ports:
            - '8001:8000'

    clickhouse:
        image: clickhouse/clickhouse-server
        environment:
            CLICKHOUSE_DB: 'symfony'
            CLICKHOUSE_USER: 'symfony'
            CLICKHOUSE_PASSWORD: 'symfony'
        ports:
            - '8123:8123'

    manticore:
        image: manticoresearch/manticore
        ulimits:
            nproc: 65535
            nofile:
                soft: 65535
                hard: 65535
            memlock:
                soft: -1
                hard: -1
        ports:
            - '9306:9306'
            - '9308:9308'

    mariadb:
        image: mariadb:11.7
        environment:
            MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 1
            MARIADB_DATABASE: my_database
        ports:
            - '3309:3306'

    meilisearch:
        image: getmeili/meilisearch:v1.19
        environment:
            MEILI_MASTER_KEY: '${MEILISEARCH_MASTER_KEY:-changeMe}'
        ports:
            - '7700:7700'

    mongodb:
        image: mongodb/mongodb-atlas-local
        environment:
            MONGODB_INITDB_ROOT_USERNAME: symfony
            MONGODB_INITDB_ROOT_PASSWORD: symfony
        ports:
            - '27017:27017'

    # Milvus services
    milvus:
        container_name: milvus-standalone
        image: milvusdb/milvus:v2.6.0
        command: [ "milvus", "run", "standalone" ]
        security_opt:
            - seccomp:unconfined
        environment:
            DEPLOY_MODE: STANDALONE
            ETCD_USE_EMBED: 'true'
            ETCD_DATA_DIR: /var/lib/milvus/etcd
            COMMON_STORAGETYPE: local
            MQ_TYPE: woodpecker
            WOODPECKER_STORAGE_TYPE: local
        volumes:
            - milvus_vlm:/var/lib/milvus
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
            interval: 30s
            start_period: 90s
            timeout: 20s
            retries: 3
        ports:
            - '19530:19530'
            - '9091:9091'

    neo4j:
        image: neo4j
        environment:
            NEO4J_AUTH: 'neo4j/${NEO4J_PASSWORD:-symfonyai}'
        ports:
            - '7474:7474'
            - '7687:7687'

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.2.2
        environment:
            discovery.type: 'single-node'
            xpack.security.enabled: false
            ES_JAVA_OPTS: '-Xms512m -Xmx512m'
        ulimits:
            memlock:
                soft: -1
                hard: -1
            nofile:
                soft: 65536
                hard: 65536
        healthcheck:
            test: [ 'CMD', 'curl', '-f', 'http://127.0.0.1:9200/_cluster/health' ]
            interval: 30s
            start_period: 120s
            timeout: 20s
            retries: 3
        ports:
            - '9201:9200'

    pinecone:
        image: ghcr.io/pinecone-io/pinecone-index:latest
        platform: linux/amd64
        environment:
            PORT: 5080
            INDEX_TYPE: serverless
            VECTOR_TYPE: dense
            DIMENSION: 1536
            METRIC: cosine
        ports:
            - '5080:5080'

    opensearch:
        image: opensearchproject/opensearch
        environment:
            discovery.type: 'single-node'
            bootstrap.memory_lock: true
            indices.requests.cache.maximum_cacheable_size: 256
            DISABLE_SECURITY_PLUGIN: true
            OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
        ulimits:
            memlock:
                soft: -1
                hard: -1
            nofile:
                soft: 65536
                hard: 65536
        healthcheck:
            test: [ 'CMD', 'curl', "-f", "http://127.0.0.1:9200" ]
            interval: 30s
            start_period: 120s
            timeout: 20s
            retries: 3
        ports:
            - '9200:9200'
            - '9600:9600'

    pogocache:
        image: pogocache/pogocache
        command: [ 'pogocache', '--auth', 'symfony' ]
        ports:
            - '9401:9401'

    postgres:
        image: pgvector/pgvector:0.8.0-pg17
        environment:
            POSTGRES_DB: my_database
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - '5432:5432'

    qdrant:
        image: qdrant/qdrant
        environment:
            QDRANT__SERVICE__API_KEY: '${QDRAT_SERVICE_API_KEY:-changeMe}'
        ports:
            - '6333:6333'

    redis:
        image: redis:8.2.2-alpine
        ports:
            - '6379:6379'

    surrealdb:
        image: surrealdb/surrealdb:v2
        command: [ 'start', '--user', 'symfony', '--pass', 'symfony' ]
        environment:
            SURREAL_HTTP_MAX_KEY_BODY_SIZE: 49152
        ports:
            - '8000:8000'

    typesense:
        image: typesense/typesense:29.0
        environment:
            TYPESENSE_API_KEY: '${TYPESENSE_API_KEY:-changeMe}'
            TYPESENSE_DATA_DIR: '/data'
        volumes:
            - typesense_data:/data
        ports:
            - '8108:8108'

    weaviate:
        image: cr.weaviate.io/semitechnologies/weaviate:1.35.3
        command: ['--host', '0.0.0.0', '--port', '8080', '--scheme', 'http']
        environment:
            QUERY_DEFAULTS_LIMIT: 25
            AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'false'
            AUTHENTICATION_APIKEY_ENABLED: 'true'
            AUTHENTICATION_APIKEY_ALLOWED_KEYS: 'symfony'
            AUTHENTICATION_APIKEY_USERS: 'symfony'
            PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
            ENABLE_API_BASED_MODULES: 'true'
            CLUSTER_HOSTNAME: 'node1'
            RAFT_ENABLE_ONE_NODE_RECOVERY: 'true' # See https://github.com/weaviate/weaviate/issues/5491#issuecomment-2416929309
        volumes:
            - weaviate_data:/var/lib/weaviate
        ports:
            - '8080:8080'
            - '50051:50051'

    litellm:
        image: ghcr.io/berriai/litellm:v1.79.1-stable
        ports:
            - "4000:4000"
        volumes:
            - ./litellm/config.yaml:/app/config.yaml
        env_file:
            - .env
            - path: .env.local
              required: false
        command: [ "--config", "/app/config.yaml", "--port", "4000", "--num_workers", "8" ]

    litellm-db:
        image: pgvector/pgvector:0.8.0-pg17
        environment:
            POSTGRES_DB: litellm
            POSTGRES_USER: litellm
            POSTGRES_PASSWORD: litellm

volumes:
    typesense_data:
    milvus_vlm:
    chroma_vlm:
    weaviate_data:
