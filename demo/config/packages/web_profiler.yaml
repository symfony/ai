when@dev:
    web_profiler:
        toolbar:
            enabled: true
            ajax_replace: true
        intercept_redirects: false
        # The default, plus the Mercure subscriptions of the Wikipedia and movie chats, which stay open by design
        excluded_ajax_paths: '^/((index|app(_[\w]+)?)\.php/)?_wdt|/\.well-known/mercure'

    framework:
        profiler:
            only_exceptions: false
            collect_serializer_data: true

when@test:
    web_profiler:
        toolbar: false
        intercept_redirects: false

    framework:
        profiler: { collect: false }
