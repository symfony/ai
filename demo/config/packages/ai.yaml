ai:
    platform:
        openai:
            api_key: '%env(OPENAI_API_KEY)%'
        huggingface:
            api_key: '%env(HUGGINGFACE_API_KEY)%'
        mistral:
            api_key: '%env(MISTRAL_API_KEY)%'
    agent:
        document:
            platform: 'ai.platform.mistral'
            model: 'mistral-medium-latest'
            # The system prompt is built dynamically in App\Document\Chat::start(), where the
            # OCR-extracted text is injected, so no static prompt is configured here.
            tools: false
        blog:
            platform: 'ai.platform.openai'
            model: 'gpt-4.1'
            prompt: |
                You are an helpful assistant that knows about the latest blog content of the Symfony's framework website.
                To search for content you use the tool 'similarity_search' for generating the answer. Only use content
                that you get from searching with that tool or your previous answers. Don't make up information and if you
                can't find something, just say so. Also provide links to the blog posts you use as sources. Use markdown
                for formatting the answer and links.
            tools:
                - 'Symfony\AI\Agent\Bridge\SimilaritySearch\SimilaritySearch'
                - service: 'clock'
                  name: 'clock'
                  description: 'Provides the current date and time.'
                  method: 'now'
            memory:
                service: 'App\Blog\SymfonyVersionsMemory'
        movies:
            platform: 'ai.platform.openai'
            model: 'gpt-4.1'
            prompt: |
                You are a friendly movie expert helping users discover films from a curated collection.

                To find movies you always use the 'movie_search' tool - never rely on your own memory and never
                invent movies. Search by title, director, cast member or a descriptive term, and only talk about
                movies the tool actually returned.

                You always answer with a structured response made of two parts:
                - 'answer': a short, conversational reply in markdown. Introduce your picks and add helpful context,
                  but do not repeat the full plot or cast - those are shown on the movie cards.
                - 'movies': the movies backing your answer, each referenced by the exact 'slug' returned by the tool,
                  together with a one-sentence 'reason' why it fits. Leave this list empty when no movie is relevant
                  (e.g. small-talk or no match) and say so in the answer.
            tools:
                - 'App\Movies\MovieSearch'
        stream:
            platform: 'ai.platform.openai'
            model: 'gpt-4.1'
            prompt:
                file: '%kernel.project_dir%/prompts/stream-chat.txt'
            tools: false
        youtube:
            platform: 'ai.platform.openai'
            model: 'gpt-5-mini'
            tools: false
        recipe:
            platform: 'ai.platform.openai'
            model: 'gpt-5-mini'
            prompt:
                text: 'You are a helpful cooking assistant. Provide detailed recipes based on user requests.'
            tools: false
        wikipedia:
            platform: 'ai.platform.openai'
            model:
                name: 'gpt-5-mini'
            prompt:
                text: |
                    Please answer the users question based on Wikipedia, only use information provided in the messages.
                    If you don't know the answer, say so. Be concise and to the point. Use markdown formatting.
                include_tools: true
            tools:
                - 'Symfony\AI\Agent\Bridge\Wikipedia\Wikipedia'
            include_sources: true
        speech:
            platform: 'ai.platform.openai'
            model: 'gpt-5-mini'
            prompt: |
                You are a friendly, positive and energetic voice assistant. You can engage in light discussions, ask
                questions, and do general small-talk. If asked about the Symfony Framework or their community events,
                you delegate to your subagent "symfony_blog" and use their answer for answering user's questions.
                If you don't know the answer, say so. Keep in mind that you are in a spoken conversation, so keep your
                answers concise and to the point. They will be read out loud to the user.
            tools:
                - 'Symfony\AI\Agent\Bridge\Clock\Clock'
                # Subagent
                - agent: 'blog'
                  name: 'symfony_blog'
                  description: |
                      Subagent, that can answer questions about latest news around the Symfony Framework, like latest
                      features, events or community news.
            speech:
                speech_to_text_platform: 'ai.platform.openai'
                stt_model: 'whisper-1'
                text_to_speech_platform: 'ai.platform.openai'
                tts_model: 'tts-1'
                tts_options:
                    voice: 'coral'
                    instructions: 'Speak in a cheerful and positive tone.'
        mcp:
            platform: 'ai.platform.openai'
            model: 'gpt-5-mini'
            prompt:
                text: |
                    You are a helpful assistant that answers questions about live football, the New York City
                    subway and the weather. All of that knowledge comes from remote MCP servers you are connected
                    to - never answer from memory, always call the matching tool first, and say so if a tool
                    gives you nothing.

                    Prefixes tell you which server a tool belongs to: 'livescore_' for football, 'transit_' for
                    the subway and 'weather_' for the weather. Some tools need an exact identifier, so look it up
                    with a search tool before you use it.

                    Answer in markdown and keep it short. The weather server draws its rain radar as text
                    characters, so wrap that map in a fenced code block to keep it readable.
                include_tools: true
            tools:
                - { mcp_server: 'remotes.livescore' }
                - { mcp_server: 'remotes.transit' }
                - { mcp_server: 'remotes.weather' }
        # Multi-agent setup
        orchestrator:
            platform: 'ai.platform.openai'
            model: 'gpt-5-mini'
            prompt: 'You are an intelligent agent orchestrator that routes user questions to specialized agents.'
            tools: false
        technical:
            platform: 'ai.platform.openai'
            model: 'gpt-5-mini'
            prompt: 'You are a technical support specialist. Help users resolve bugs, problems, and technical errors.'
            tools: false
        fallback:
            platform: 'ai.platform.openai'
            model: 'gpt-5-mini'
            prompt: 'You are a helpful general assistant. Assist users with any questions or tasks they may have.'
            tools: false
    multi_agent:
        support:
            orchestrator: 'orchestrator'
            handoffs:
                technical: ['bug', 'problem', 'technical', 'error', 'code', 'debug']
            fallback: 'fallback'
    store:
        postgres:
            symfony_blog:
                dbal_connection: 'doctrine.dbal.default_connection'
                table_name: 'symfony_blog'
                distance: 'cosine'
    vectorizer:
        openai:
            platform: 'ai.platform.openai'
            model: 'text-embedding-ada-002'
    indexer:
        blog:
            loader: 'Symfony\AI\Store\Document\Loader\RssFeedLoader'
            source: 'https://feeds.feedburner.com/symfony/blog'
            filters:
                - 'app.filter.week_of_symfony'
            transformers:
                - 'Symfony\AI\Store\Document\Transformer\TextSplitTransformer'
                - 'Symfony\AI\Store\Document\Transformer\TextTrimTransformer'
            vectorizer: 'ai.vectorizer.openai'
            store: 'ai.store.postgres.symfony_blog'
    retriever:
        blog:
            store: 'ai.store.postgres.symfony_blog'
            vectorizer: 'ai.vectorizer.openai'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    Symfony\AI\Agent\Bridge\SimilaritySearch\SimilaritySearch:
        $retriever: '@ai.retriever.blog'

    Symfony\AI\Store\Document\Loader\RssFeedLoader: ~
    Symfony\AI\Store\Document\Transformer\TextSplitTransformer: ~
    Symfony\AI\Store\Document\Transformer\TextTrimTransformer: ~

    app.filter.week_of_symfony:
        class: 'Symfony\AI\Store\Document\Filter\TextContainsFilter'
        arguments:
            $needle: 'Week of Symfony'
            $caseSensitive: false
