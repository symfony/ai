mcp:
    servers:
        demo:
            name: demo-app
            version: 0.0.1
            pagination_limit: 10
            instructions: |
                This demo MCP server provides time management capabilities for developers.

                Use this server when you need to work with timestamps, time zones, or time-based calculations.

            transports:
                stdio: true
                http: true
            http:
                path: /_mcp
            session:
                store: file

            tools: ['*']
            prompts: ['*']
            resources: ['*']
            resource_templates: ['*']
            apps: ['*']
