ux_icons:
    # Default icon size
    default_icon_attributes:
        height: 20px
        width: 20px

    # Icon aliases for cleaner templates
    aliases:
        # Example icons, from the Symfony AI design system
        youtube: demo:youtube
        recipe: demo:recipe
        wikipedia: demo:wikipedia
        symfony: demo:symfony
        crop: demo:crop
        microphone: demo:microphone
        video: demo:video
        turbo: demo:turbo
        document: demo:document
        movie: demo:movie
        mcp: demo:plug-connected

        # UI icons
        github: demo:github
        send: demo:send
        bot: demo:bot
        code: demo:code
        arrow-left: demo:arrow-left
        arrow-up-right: demo:arrow-up-right

        # Recipe specific icons
        clock: mdi:clock
        difficulty: mdi:signal-variant
        vegetarian: mdi:leaf
        ingredients: mdi:format-list-checkbox
        steps: mdi:clipboard-list
        email: mdi:email-send

        # Speech specific icons
        microphone-mute: iconoir:microphone-mute-solid
        timer: iconoir:timer-solid
