index:
    path: '/'
    controller: 'Symfony\Bundle\FrameworkBundle\Controller\TemplateController'
    defaults:
        template:  'index.html.twig'

blog:
    path: '/blog'
    controller: 'Symfony\Bundle\FrameworkBundle\Controller\TemplateController'
    defaults:
        template:  'chat.html.twig'
        context: { chat: 'blog' }

document:
    path: '/document'
    controller: 'Symfony\Bundle\FrameworkBundle\Controller\TemplateController'
    defaults:
        template:  'chat.html.twig'
        context: { chat: 'document' }

mcp:
    path: '/mcp'
    controller: 'Symfony\Bundle\FrameworkBundle\Controller\TemplateController'
    defaults:
        template:  'chat.html.twig'
        context: { chat: 'mcp' }

movies:
    path: '/movies'
    controller: 'Symfony\Bundle\FrameworkBundle\Controller\TemplateController'
    defaults:
        template:  'chat.html.twig'
        context: { chat: 'movies' }

crop:
    path: '/crop'
    controller: 'Symfony\Bundle\FrameworkBundle\Controller\TemplateController'
    defaults:
        template:  'crop.html.twig'

recipe:
    path: '/recipe'
    controller: 'Symfony\Bundle\FrameworkBundle\Controller\TemplateController'
    defaults:
        template:  'chat.html.twig'
        context: { chat: 'recipe' }

recipe_assistant_reply:
    path: '/recipe/assistant-reply'
    controller: 'App\Recipe\TwigComponent::streamContent'

speech:
    path: '/speech'
    controller: 'Symfony\Bundle\FrameworkBundle\Controller\TemplateController'
    defaults:
        template:  'chat.html.twig'
        context: { chat: 'speech' }

stream:
    path: '/stream'
    controller: 'Symfony\Bundle\FrameworkBundle\Controller\TemplateController'
